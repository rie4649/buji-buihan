<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無事故無違反</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14264A">
<style>
body{
margin:0;
font-family:"Hiragino Sans","Yu Gothic",Arial,sans-serif;
background:linear-gradient(160deg,#14264A 0%,#1d3768 100%);
color:#222;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
box-sizing:border-box;
}
.card{
background:#fff;
border-radius:24px;
padding:52px 30px 36px;
max-width:420px;
width:100%;
text-align:center;
box-shadow:0 16px 40px rgba(0,0,0,.25);
position:relative;
}
h1{
margin:0 0 6px;
font-size:22px;
color:#14264A;
letter-spacing:0.05em;
}
.subtitle{
margin:0 0 28px;
font-size:13px;
color:#888;
}
.counterBox{
background:#14264A;
border-radius:20px;
padding:34px 10px;
margin-bottom:18px;
}
.bigNumber{
font-size:76px;
font-weight:900;
color:#FFB800;
line-height:1;
}
.unit{
font-size:16px;
color:#fff;
font-weight:700;
margin-top:6px;
}
.startDateText{
font-size:13px;
color:#888;
margin-bottom:22px;
}
.bestBox{
display:flex;
align-items:center;
justify-content:space-between;
background:#F5F5F7;
border-radius:14px;
padding:14px 18px;
margin-bottom:26px;
font-size:14px;
color:#444;
}
.bestBox strong{
font-size:20px;
color:#14264A;
}
button{
width:100%;
padding:16px;
font-size:15px;
font-weight:700;
border:none;
border-radius:14px;
cursor:pointer;
font-family:inherit;
}
.resetBtn{
background:#E0483E;
color:#fff;
}
.resetBtn:hover{
background:#c73a30;
}
.installBar{
display:flex;
justify-content:center;
margin-bottom:14px;
}
.installBtn{
display:none;
align-items:center;
justify-content:center;
gap:5px;
background:#0b63ce;
color:#fff;
border:none;
border-radius:999px;
padding:9px 16px;
font-size:12.5px;
font-weight:700;
cursor:pointer;
font-family:inherit;
position:absolute;
top:14px;
right:14px;
box-shadow:0 4px 10px rgba(11,99,206,.35);
}
.installHelp{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:10000;
align-items:center;
justify-content:center;
padding:20px;
}
.installHelp .box{
background:#fff;
border-radius:14px;
padding:22px;
max-width:340px;
width:100%;
text-align:left;
}
.installHelp h3{margin:0 0 10px;color:#14264A;font-size:17px}
.installHelp p{font-size:13px;color:#555;line-height:1.7}
.installHelp button{
margin-top:14px;
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#E9E9EB;
font-weight:700;
cursor:pointer;
font-size:14px;
font-family:inherit;
}
.hint{
margin-top:16px;
font-size:12px;
color:#999;
line-height:1.7;
}

/* --- 追加分: 設定ボタン --- */
.settingsBtn{
display:flex;
align-items:center;
justify-content:center;
background:#F0F1F4;
color:#14264A;
border:none;
border-radius:999px;
width:38px;
height:38px;
font-size:17px;
cursor:pointer;
position:absolute;
top:14px;
left:14px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
padding:0;
}

/* --- 追加分: 履歴リンク --- */
.historyLink{
display:inline-block;
margin-top:14px;
font-size:12.5px;
color:#0b63ce;
background:none;
border:none;
padding:0;
width:auto;
cursor:pointer;
font-weight:700;
text-decoration:underline;
font-family:inherit;
}

/* --- 追加分: 汎用モーダル(設定・履歴共通) --- */
.modalOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:10000;
align-items:center;
justify-content:center;
padding:20px;
}
.modalOverlay .box{
background:#fff;
border-radius:14px;
padding:22px;
max-width:360px;
width:100%;
text-align:left;
max-height:80vh;
overflow-y:auto;
}
.modalOverlay h3{margin:0 0 14px;color:#14264A;font-size:17px}
.modalOverlay label{
display:block;
font-size:13px;
color:#555;
margin-bottom:6px;
font-weight:700;
}
.modalOverlay input[type="date"]{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
box-sizing:border-box;
font-family:inherit;
margin-bottom:16px;
}
.modalBtnRow{
display:flex;
gap:8px;
}
.modalBtnRow button{
padding:11px;
font-size:14px;
}
.saveBtn{
background:#14264A;
color:#fff;
}
.closeBtn{
background:#E9E9EB;
color:#222;
}
.historyEmpty{
font-size:13px;
color:#999;
text-align:center;
padding:20px 0;
}
.historyItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 4px;
border-bottom:1px solid #F0F0F0;
font-size:13.5px;
}
.historyItem:last-child{border-bottom:none;}
.historyItem .hDate{color:#555;}
.historyItem .hDays{
font-weight:800;
color:#E0483E;
}
.historyClearBtn{
margin-top:12px;
background:#F5F5F7;
color:#999;
font-size:12px;
padding:9px;
}
</style>
</head>
<body>

<div id="installHelp" class="installHelp">
<div class="box">
<h3>アプリとして追加する方法</h3>
<p id="installHelpText"></p>
<button onclick="document.getElementById('installHelp').style.display='none'">閉じる</button>
</div>
</div>

<!-- 追加分: 設定モーダル -->
<div id="settingsModal" class="modalOverlay">
<div class="box">
<h3>⚙️ 設定</h3>
<label for="startDateInput">記録開始日（基準日）を合わせる</label>
<input type="date" id="startDateInput">
<div class="modalBtnRow">
<button class="closeBtn" onclick="closeSettings()">キャンセル</button>
<button class="saveBtn" onclick="saveSettings()">保存</button>
</div>
</div>
</div>

<!-- 追加分: 履歴モーダル -->
<div id="historyModal" class="modalOverlay">
<div class="box">
<h3>📋 リセット履歴</h3>
<div id="historyList"></div>
<button class="historyClearBtn" onclick="clearHistory()">履歴を全て削除</button>
<div class="modalBtnRow" style="margin-top:10px;">
<button class="closeBtn" onclick="closeHistory()">閉じる</button>
</div>
</div>
</div>

<div class="card">
<button class="settingsBtn" id="settingsBtn" onclick="openSettings()">⚙️</button>
<button class="installBtn" id="installBtn" onclick="handleInstallClick()">📲 アプリ追加</button>
<h1>🛡 無事故無違反</h1>
<p class="subtitle">安全運転の記録</p>

<div class="counterBox">
<div class="bigNumber" id="dayCount">0</div>
<div class="unit">日 達成中</div>
</div>

<p class="startDateText" id="startDateText"></p>

<div class="bestBox">
<span>これまでの最長記録</span>
<strong id="bestCount">0日</strong>
</div>

<button class="resetBtn" onclick="resetCounter()">事故・違反が発生した(記録をリセット)</button>
<p class="hint">記録はこの端末のブラウザに保存されます。<br>他のパソコンやスマホとは共有されません。</p>
<button class="historyLink" onclick="openHistory()">📋 リセット履歴を見る</button>
</div>

<script>
if("serviceWorker" in navigator){
window.addEventListener("load", ()=>{
navigator.serviceWorker.register("sw.js").catch(()=>{});
});
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
e.preventDefault();
deferredInstallPrompt = e;
installBtn.style.display = "flex";
});

window.addEventListener("appinstalled", ()=>{
installBtn.style.display = "none";
deferredInstallPrompt = null;
});

function detectManualInstallText(){
const ua = navigator.userAgent;
const isMac = /Macintosh/.test(ua);
const isWin = /Windows/.test(ua);
const isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua);
if(isSafari && isMac) return "Safariのメニューバーで「ファイル」→「Dockに追加」を選んでください。(Safari 17以降)";
if(isSafari) return "共有ボタン(□に↑のアイコン)をタップし、「ホーム画面に追加」を選んでください。";
if(isWin || isMac) return "アドレスバー右端の「インストール」アイコンをクリックしてください。表示されない場合は、ブラウザ右上のメニュー(⋮)から「アプリをインストール」を選んでください。";
return "ブラウザのメニューから「ホーム画面に追加」または「インストール」を選んでください。";
}

async function handleInstallClick(){
if(deferredInstallPrompt){
deferredInstallPrompt.prompt();
const choice = await deferredInstallPrompt.userChoice;
deferredInstallPrompt = null;
if(choice.outcome === "accepted") installBtn.style.display = "none";
return;
}
document.getElementById("installHelpText").textContent = detectManualInstallText();
document.getElementById("installHelp").style.display = "flex";
}

if(!("onbeforeinstallprompt" in window)){
installBtn.style.display = "flex";
}

const KEY_START = "bujibuihan_startDate";
const KEY_BEST = "bujibuihan_bestStreak";
const KEY_HISTORY = "bujibuihan_history"; // 追加分: リセット履歴

function todayDateOnly(){
const d = new Date();
d.setHours(0,0,0,0);
return d;
}

function getStartDate(){
let stored = localStorage.getItem(KEY_START);
if(!stored){
stored = todayDateOnly().toISOString().slice(0,10);
localStorage.setItem(KEY_START, stored);
}
const d = new Date(stored + "T00:00:00");
return d;
}

function getBest(){
return parseInt(localStorage.getItem(KEY_BEST) || "0", 10);
}

function formatDate(d){
return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
}

function daysBetween(d1, d2){
const msPerDay = 24*60*60*1000;
return Math.round((d2 - d1) / msPerDay);
}

function updateDisplay(){
const start = getStartDate();
const today = todayDateOnly();
const days = Math.max(0, daysBetween(start, today));

dayCount.textContent = days;
startDateText.textContent = "記録開始日: " + formatDate(start);

const best = Math.max(getBest(), days);
localStorage.setItem(KEY_BEST, String(best));
bestCount.textContent = best + "日";
}

function resetCounter(){
if(!confirm("記録をリセットして、今日から数え直しますか？")) return;

// 追加分: リセット前の達成日数を履歴に記録
const start = getStartDate();
const today = todayDateOnly();
const daysAchieved = Math.max(0, daysBetween(start, today));
addHistoryEntry(today.toISOString().slice(0,10), daysAchieved);

const todayStr = today.toISOString().slice(0,10);
localStorage.setItem(KEY_START, todayStr);
updateDisplay();
}

/* ===== 追加分: 設定（日付合わせ） ===== */
function openSettings(){
const start = getStartDate();
document.getElementById("startDateInput").value = start.toISOString().slice(0,10);
document.getElementById("settingsModal").style.display = "flex";
}

function closeSettings(){
document.getElementById("settingsModal").style.display = "none";
}

function saveSettings(){
const val = document.getElementById("startDateInput").value;
if(!val){
alert("日付を選択してください");
return;
}
localStorage.setItem(KEY_START, val);
updateDisplay();
closeSettings();
}

/* ===== 追加分: リセット履歴 ===== */
function getHistory(){
try{
return JSON.parse(localStorage.getItem(KEY_HISTORY) || "[]");
}catch(e){
return [];
}
}

function addHistoryEntry(dateStr, days){
const history = getHistory();
history.unshift({date: dateStr, days: days});
localStorage.setItem(KEY_HISTORY, JSON.stringify(history));
}

function renderHistory(){
const history = getHistory();
const listEl = document.getElementById("historyList");
if(history.length === 0){
listEl.innerHTML = '<div class="historyEmpty">まだリセット履歴はありません</div>';
return;
}
listEl.innerHTML = history.map(item=>{
const d = new Date(item.date + "T00:00:00");
return '<div class="historyItem"><span class="hDate">' + formatDate(d) + '</span><span class="hDays">' + item.days + '日 達成</span></div>';
}).join("");
}

function openHistory(){
renderHistory();
document.getElementById("historyModal").style.display = "flex";
}

function closeHistory(){
document.getElementById("historyModal").style.display = "none";
}

function clearHistory(){
if(!confirm("リセット履歴を全て削除しますか？この操作は取り消せません。")) return;
localStorage.removeItem(KEY_HISTORY);
renderHistory();
}

updateDisplay();
</script>
</body>
</html>
